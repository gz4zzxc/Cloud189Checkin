name: Cloud check in action

on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: 35 2 * * *

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: user
    env:
      TY_ACCOUNTS: ${{ secrets.TY_ACCOUNTS }}
      TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 || secrets.TY_USER_NAME }}
      TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 || secrets.TY_PASSWORD }}
      TY_USERNAME_2: ${{ secrets.TY_USERNAME_2 }}
      TY_PASSWORD_2: ${{ secrets.TY_PASSWORD_2 }}
      TY_USERNAME_3: ${{ secrets.TY_USERNAME_3 }}
      TY_PASSWORD_3: ${{ secrets.TY_PASSWORD_3 }}
      TY_USERNAME_4: ${{ secrets.TY_USERNAME_4 }}
      TY_PASSWORD_4: ${{ secrets.TY_PASSWORD_4 }}
      TY_USERNAME_5: ${{ secrets.TY_USERNAME_5 }}
      TY_PASSWORD_5: ${{ secrets.TY_PASSWORD_5 }}
      TY_USERNAME_6: ${{ secrets.TY_USERNAME_6 }}
      TY_PASSWORD_6: ${{ secrets.TY_PASSWORD_6 }}
      TY_USERNAME_7: ${{ secrets.TY_USERNAME_7 }}
      TY_PASSWORD_7: ${{ secrets.TY_PASSWORD_7 }}
      TY_USERNAME_8: ${{ secrets.TY_USERNAME_8 }}
      TY_PASSWORD_8: ${{ secrets.TY_PASSWORD_8 }}
      TY_USERNAME_9: ${{ secrets.TY_USERNAME_9 }}
      TY_PASSWORD_9: ${{ secrets.TY_PASSWORD_9 }}
      TY_USERNAME_10: ${{ secrets.TY_USERNAME_10 }}
      TY_PASSWORD_10: ${{ secrets.TY_PASSWORD_10 }}
      SENDKEY: ${{ secrets.SENDKEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
      WECOM_BOT_TELPHONE: ${{ secrets.WECOM_BOT_TELPHONE }}
      WX_PUSHER_APP_TOKEN: ${{ secrets.WX_PUSHER_APP_TOKEN }}
      WX_PUSHER_UID: ${{ secrets.WX_PUSHER_UID }}
      PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      BARK_SERVER: ${{ secrets.BARK_SERVER }}
      SHOWDOC_KEY: ${{ secrets.SHOWDOC_KEY }}

    steps:
      - name: Random delay 0-300 seconds
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 301))

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 18
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 18
          cache: npm

      - name: Validate account configuration
        shell: bash
        run: |
          if [[ -z "${TY_ACCOUNTS}" && ( -z "${TY_USERNAME_1}" || -z "${TY_PASSWORD_1}" ) ]]; then
            echo "::error::No Cloud189 account credentials are configured"
            exit 1
          fi

      - name: Enable verbose logging
        if: vars.debug == '1'
        run: echo "CLOUD189_VERBOSE=1" >> "$GITHUB_ENV"

      - name: Restore cached cookie
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: Install dependencies
        run: npm install

      - name: Run with retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3"
            if timeout 30m npm start; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "All attempts failed" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> "$GITHUB_ENV"

      - name: Save cached cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}
